<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .hero{
            font-family: sans-serif;
            padding: 40px;
        }
        .hero-text{
            display: flex;
            gap: 39px;
            padding: 40px;
            padding-left: 70px;
            padding-right: 70px;
        }
        .hero h1{
            font-size: 50px;
        }
        .hero h4{
            font-size: 20px;
            color: rgb(85, 85, 85);
        }
        .hero p{
            font-size: 15px;
            color: rgb(85, 85, 85);  
        }
        /*  */
        .hero-form{
            background-color: beige;
            height: 400px;
            border-radius: 8px;
            padding: 30px;
        }
        .hero-form input{
            height: 30px;
            width: 470px;
            margin-bottom: 20px;
            border-radius: 8px;
            border: none;
            padding: 10px;
            margin-top: 20px;
        }
        .email input{
            width: 100%;
            margin-top: 10px;
        }
        .message input{
            width: 100%;
            height: 90px;
            margin-top: 10px;
        }
        /*  */
        .hero-form button{
            height: 50px;
            width: 100px;
            font-size: 15px;
            border-radius: 50px;
            border: none;
            background-color: rgb(255, 123, 28);
            color: aliceblue;
        }
    </style>
</head>
<body>
    <section class="container">
        <div class="hero">
            <div class="hero-text">
                <div class="text">
                    <h1>Get started now!</h1>
                    <h4>If you would like to work with us or just want to get in touch, we’d love to hear from you!</h4>
                </div>
                <div class="p">
                    <p>At vero eos et accusam et justo duo dolores et ea rebum. Stet clita kasd gubergren, no sea takimata sanctus est Lorem ipsum dolor sit amet.</p>
                </div>
            </div>    
            <div class="hero-form">
                <form action="./MY WEB.html">
                    <div class="text">
                        <label for="">First Name</label>
                        <input type="text" placeholder="Enter your first Name">

                        <label for="">Last Name</label>
                        <input type="text" placeholder="Enter your Last Name"> <br>
                    </div>
                    <div class="email">
                        <label for="">Email</label>
                        <input type="email" placeholder="Enter a valid email address">
                    </div>
                    <div class="message">
                       <label for="">Message</label>
                        <input type="text" placeholder="Enter your message"> 
                    </div>
                    <div class="button">
                        <button class="Submit">Submit</button>
                    </div>

                </form>
            </div>
        </div>
    </section>
    
</body>
</html>
