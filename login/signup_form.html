<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>signup</title>
    <style>
        .form_container{
            width: 350px;
            margin: 50px auto;    
            padding: 20px;           
            border: 1px solid #ccc;    
            border-radius: 8px;         
            background-color: #d9d9d9; 
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .form_container h1{
            text-align: center;        
            margin-bottom: 20px;
            font-size: 40px;
            font-family: sans-serif;
            color: blue;
        }
        label{
            display: block;          
            margin-top: 10px;
            margin-bottom: 5px;
            font-weight: bold;
            font-family: sans-serif;
        }
        input{
            width: 100%;                
            padding: 10px;            
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        button{
            width: 100%;
            padding: 10px;
            background-color: #339036; 
            color: white;              
            border: none;
            border-radius: 5px;
            cursor: pointer;           
            margin-top: 15px;
            font-size: 16px;
        }
        button:hover {
            background-color: #027102;
        }
         
         @media (max-width: 768x){
             .hero {
                flex-direction: column-reverse;
                text-align: center;
            }

             .hero-buttons {
                justify-content: center;

            }

            .hero-image img {
                width: 220px;
                height: 220px;
            }
         }
    </style>
</head>
<body>
    <div class="form_container">
        <h1>signup</h1>

        <label for="">enter your name</label>
        <input type="text">

        <label for="">enter your email</label>
        <input type="email" name="" id="">

        <label for="">enter your password</label>
        <input type="password" name="" id="">

        <button>Register</button>
    </div>
</body>
</html>
